name: Ada inbound history
on:
  pull_request:
    paths: ['sync-agent/live/**', 'sync-agent/history/**', 'supabase/migrations/*ada_inbound*', '.github/workflows/ada-inbound-ci.yml']
  push:
    paths: ['sync-agent/live/**', 'sync-agent/history/**', 'supabase/migrations/*ada_inbound*', '.github/workflows/ada-inbound-ci.yml']
permissions:
  contents: read
jobs:
  inbound:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sccrm_inbound_test_ci
        ports: ['55446:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sccrm_inbound_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: sync-agent
    env:
      SCCRM_INBOUND_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55446/sccrm_inbound_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sync-agent/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test --test-concurrency=1 live/inbound*.test.cjs live/registration-confirmation.test.cjs
  windows-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the native read transports
        shell: pwsh
        run: |
          foreach ($source in @('sync-agent/live/LiveSqlRpc.ps1','sync-agent/live/Read-BranchCustomer.ps1','sync-agent/live/Read-BranchReceipts.ps1')) {
            $parseErrors=$null; $parseTokens=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $source),[ref]$parseTokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
