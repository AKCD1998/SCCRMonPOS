name: Desktop checks
on:
  push:
    branches: [master]
    paths: ['SCCRMonPOS/**', 'tools/**', 'installer/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['SCCRMonPOS/**', 'tools/**', 'installer/**', '.github/workflows/desktop-ci.yml']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Check website release catalog
        shell: pwsh
        run: ./tools/WebReleaseCatalogCheck.ps1
      - name: Build and check desktop features
        shell: pwsh
        run: |
          msbuild tools/DesktopFeatureCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/desktop-feature-check/DesktopFeatureCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/MemberApiCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/member-api-check/MemberApiCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/DeviceAccessCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/device-access-check/DeviceAccessCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/PurchaseHistoryCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/purchase-history-check/PurchaseHistoryCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/AdaPosSetupCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/adapos-setup-check/AdaPosSetupCheck.exe
          exit $LASTEXITCODE
