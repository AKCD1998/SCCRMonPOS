name: Desktop checks
on:
  push:
    branches: [master]
    paths: ['SCCRMonPOS/**', 'tools/**', 'installer/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['SCCRMonPOS/**', 'tools/**', 'installer/**', '.github/workflows/desktop-ci.yml']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Check website release catalog
        shell: pwsh
        run: ./tools/WebReleaseCatalogCheck.ps1
      - name: Build and check desktop features
        shell: pwsh
        run: |
          msbuild tools/DesktopFeatureCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/desktop-feature-check/DesktopFeatureCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/MemberApiCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/member-api-check/MemberApiCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/DeviceAccessCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/device-access-check/DeviceAccessCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/PurchaseHistoryCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/purchase-history-check/PurchaseHistoryCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/AdaPosSetupCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/adapos-setup-check/AdaPosSetupCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/ReceiptScopeCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/receipt-scope-check/ReceiptScopeCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/ReceiptClaimStatusCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/receipt-claim-status-check/ReceiptClaimStatusCheck.exe
      - name: Build and test administrator-requested fleet updates
        run: |
          msbuild tools/FleetUpdateCheck.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-verify/fleet-update-check/FleetUpdateCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/FleetConsole.csproj /t:Build /p:Configuration=Release /nologo /v:minimal
          exit $LASTEXITCODE
      - name: Package the checked release candidate
        shell: pwsh
        run: |
          $package='build-verify/ci-package'
          New-Item -ItemType Directory -Path "$package/release" -Force | Out-Null
          Copy-Item SCCRMonPOS/bin/Release/SCCRMonPOS.exe "$package/release/SCCRMonPOS.exe"
          Copy-Item build-verify/desktop-feature-check "$package/verifier" -Recurse
          @{commit=(git rev-parse HEAD);runId=$env:GITHUB_RUN_ID;sha256=(Get-FileHash "$package/release/SCCRMonPOS.exe" -Algorithm SHA256).Hash.ToLowerInvariant();version=(Get-Item "$package/release/SCCRMonPOS.exe").VersionInfo.FileVersion}|ConvertTo-Json|Set-Content "$package/provenance.json" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: pos-desktop-${{ github.sha }}
          path: build-verify/ci-package/
          retention-days: 14
